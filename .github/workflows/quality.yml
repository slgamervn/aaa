name: Quality checks

on:
  push:
    branches:
      - design/humanized-library
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # npm ci fails when package.json and the committed lockfile disagree.
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Build production application
        run: npm run build
