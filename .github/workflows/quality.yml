name: Quality checks

on:
  push:
    branches:
      - design/humanized-library
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Build production application
        run: npm run build

  e2e:
    name: Browser E2E — desktop and mobile
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BASE_URL: https://pjvault-git-design-humanized-library-slg-7f71.vercel.app
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Wait for the current feature-branch Preview deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const branch = "design/humanized-library";
          const endpoint = `https://api.github.com/repos/${repository}/commits/${encodeURIComponent(branch)}/status`;

          for (let attempt = 1; attempt <= 80; attempt += 1) {
            const response = await fetch(endpoint, {
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28"
              }
            });
            if (!response.ok) {
              throw new Error(`GitHub status lookup failed: HTTP ${response.status}`);
            }

            const combined = await response.json();
            const deployment = (combined.statuses ?? [])
              .filter((item) => item.context === "Vercel")
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];

            if (deployment?.state === "success") {
              console.log(`Preview deployment is ready: ${deployment.target_url}`);
              process.exit(0);
            }
            if (deployment?.state === "failure" || deployment?.state === "error") {
              if (!deployment.target_url?.includes("upgradeToPro=build-rate-limit")) {
                throw new Error(`Vercel Preview deployment failed: ${deployment.target_url}`);
              }

              // Vercel's build quota is temporarily exhausted. Reuse the last READY
              // Preview only when every change since it is limited to test/docs/CI files.
              const lastReadyPreviewSha = "7814754f96088c8f490acd9cdbea8da3bb26d0e0";
              const compareUrl = `https://api.github.com/repos/${repository}/compare/${lastReadyPreviewSha}...${encodeURIComponent(branch)}`;
              const compareResponse = await fetch(compareUrl, {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28"
                }
              });
              if (!compareResponse.ok) {
                throw new Error(`Cannot verify Preview fallback source: HTTP ${compareResponse.status}`);
              }

              const comparison = await compareResponse.json();
              const allowedFiles = new Set([
                ".github/workflows/quality.yml",
                "README.md",
                "e2e/pjvault.spec.ts"
              ]);
              const unexpectedFiles = (comparison.files ?? [])
                .map((file) => file.filename)
                .filter((filename) => !allowedFiles.has(filename));
              if (unexpectedFiles.length > 0) {
                throw new Error(`Refusing stale Preview fallback; application files changed: ${unexpectedFiles.join(", ")}`);
              }

              const [homeResponse, catalogResponse] = await Promise.all([
                fetch(process.env.PLAYWRIGHT_BASE_URL),
                fetch(new URL("/api/games", process.env.PLAYWRIGHT_BASE_URL))
              ]);
              if (!homeResponse.ok || !catalogResponse.ok) {
                throw new Error("The last READY Preview failed its HTTP smoke check.");
              }
              const catalog = await catalogResponse.json();
              if (!Array.isArray(catalog.games) || catalog.games.length === 0) {
                throw new Error("The last READY Preview returned an empty published catalogue.");
              }

              console.log("Vercel build quota is exhausted; using the last READY Preview because only the CI workflow, README and E2E test file changed.");
              process.exit(0);
            }

            console.log(`Waiting for Vercel Preview (attempt ${attempt}/80)...`);
            await new Promise((resolve) => setTimeout(resolve, 15_000));
          }

          throw new Error("Timed out waiting for the Vercel Preview deployment.");
          NODE

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pjvault-playwright-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
