name: Quality checks

on:
  push:
    branches:
      - design/humanized-library
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # Generate a lockfile when bootstrapping, then validate it using npm ci.
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Upload generated lockfile for commit
        uses: actions/upload-artifact@v7
        with:
          name: pjvault-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

  commit_lockfile:
    name: Commit validated lockfile
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/design/humanized-library'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Download validated lockfile
        uses: actions/download-artifact@v7
        with:
          name: pjvault-package-lock-${{ github.sha }}
          path: .

      - name: Commit lockfile to feature branch
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "The validated lockfile is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Add validated npm dependency lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
