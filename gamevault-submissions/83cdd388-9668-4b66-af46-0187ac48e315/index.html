<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Thiên Kiếm — Diệt Ma Lộ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd27a;--gold2:#ff9a2e;--red:#ff3b4e;--cyan:#5ef2ff;--panel:rgba(12,10,20,.72);--disp:'Bungee','Chakra Petch',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Chakra Petch',sans-serif;color:#eee;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
.hide{display:none!important}
/* overlays */
#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}
#hurtfx{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(200,0,20,.75) 100%);transition:opacity .08s}
#lowhp{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(140,0,10,.6) 100%);animation:beat 1s infinite}
@keyframes beat{0%,100%{filter:brightness(1)}50%{filter:brightness(1.6)}}
#flashfx{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:0;background:#fff;mix-blend-mode:screen}
#letterbox i{position:fixed;left:0;right:0;height:0;background:#000;z-index:8;transition:height .7s cubic-bezier(.77,0,.18,1)}
#letterbox i:first-child{top:0}#letterbox i:last-child{bottom:0}
#letterbox.on i{height:11vh}
#dmg{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.dn{position:absolute;left:0;top:0;font-family:var(--disp);font-size:22px;color:#fff;white-space:nowrap;pointer-events:none;will-change:transform,opacity;
 text-shadow:0 2px 0 #000,0 0 2px #000,0 0 12px rgba(255,140,40,.9);letter-spacing:.02em}
.dn.crit{color:#ffd84a;font-size:34px;text-shadow:0 3px 0 #5a1800,0 0 3px #000,0 0 18px rgba(255,80,0,1)}
.dn.pl{color:#ff5566;font-size:24px;text-shadow:0 2px 0 #300,0 0 12px rgba(255,0,40,.9)}
.dn.heal{color:#7dff9a;text-shadow:0 2px 0 #031,0 0 10px rgba(60,255,120,.9)}
.dn.txt{font-size:18px;color:#bfe9ff;text-shadow:0 2px 0 #012,0 0 10px rgba(90,220,255,.9)}
/* screens */
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:30;padding:20px}
.screen.on{display:flex;animation:fadein .5s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.dim{background:radial-gradient(ellipse at center,rgba(10,6,20,.55),rgba(0,0,0,.88))}
.logo{font-family:var(--disp);font-size:clamp(46px,11vw,128px);line-height:.95;text-align:center;letter-spacing:.03em;
 background:linear-gradient(180deg,#fffbe8 0%,#ffd77a 38%,#d27413 52%,#ffcf6b 70%,#fff0c2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 5px 0 #2a0e00) drop-shadow(0 0 28px rgba(255,140,40,.55));animation:logoIn 1.2s cubic-bezier(.2,1.4,.3,1) both}
@keyframes logoIn{from{transform:scale(2.2) translateY(-20px);opacity:0;filter:blur(12px)}to{transform:none;opacity:1}}
.sub{font-family:var(--disp);font-size:clamp(14px,2.6vw,24px);letter-spacing:.5em;color:#ffb0b0;margin:6px 0 4px;text-shadow:0 0 14px rgba(255,40,60,.8);text-align:center;padding-left:.5em}
.tagline{font-size:clamp(13px,1.8vw,17px);color:#cfc3d9;opacity:.85;margin-bottom:34px;text-align:center;letter-spacing:.08em}
.btn{font-family:var(--disp);font-size:clamp(16px,2.4vw,22px);padding:14px 48px;margin:7px;color:#241002;letter-spacing:.06em;position:relative;
 background:linear-gradient(180deg,#fff0bf,#ffc04d 55%,#ff8a1e);clip-path:polygon(16px 0,100% 0,calc(100% - 16px) 100%,0 100%);
 transition:transform .18s cubic-bezier(.34,1.8,.64,1),filter .2s;min-width:260px}
.btn:hover,.btn:focus-visible{transform:scale(1.07);filter:brightness(1.12) drop-shadow(0 0 14px #ffae3a)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:linear-gradient(180deg,rgba(255,210,122,.16),rgba(255,210,122,.05));color:var(--gold);outline:2px solid rgba(255,210,122,.5);outline-offset:-2px}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;align-items:center}
.h2{font-family:var(--disp);font-size:clamp(24px,4.5vw,46px);color:var(--gold);text-shadow:0 3px 0 #2a0e00,0 0 20px rgba(255,150,40,.5);text-align:center;margin-bottom:18px;letter-spacing:.04em}
/* device select */
.devs{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.dev{width:min(42vw,250px);padding:26px 14px 20px;background:var(--panel);border:1px solid rgba(255,210,122,.3);position:relative;transition:transform .25s cubic-bezier(.34,1.6,.64,1),border-color .2s,box-shadow .2s;
 clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.dev:hover,.dev.rec{border-color:var(--gold);box-shadow:inset 0 0 40px rgba(255,170,60,.18)}
.dev:hover{transform:translateY(-6px) scale(1.03)}
.dev svg{width:84px;height:84px;stroke:var(--gold);fill:none;stroke-width:1.6;filter:drop-shadow(0 0 10px rgba(255,170,60,.6))}
.dev b{display:block;font-family:var(--disp);font-size:clamp(16px,2.6vw,22px);margin-top:12px;color:#fff}
.dev small{display:block;font-size:13px;color:#b9adc6;margin-top:6px}
.dev .rec-tag{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.2em;color:#1a0b00;background:var(--gold);padding:2px 8px;display:none;font-weight:700}
.dev.rec .rec-tag{display:block}
/* help */
.help{max-width:880px;width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:18px;max-height:62vh;overflow:auto;padding:4px}
.hcard{background:var(--panel);border-left:3px solid var(--gold);padding:12px 14px;font-size:14px;line-height:1.55}
.hcard h4{font-family:var(--disp);font-weight:400;color:var(--gold);font-size:15px;margin-bottom:6px;letter-spacing:.04em}
kbd{display:inline-block;min-width:22px;padding:1px 6px;margin:0 2px;font-family:'Chakra Petch';font-weight:700;font-size:12px;color:#1a0b00;background:linear-gradient(#fff3cf,#ffc865);border-radius:3px;box-shadow:0 2px 0 #7a4a10;text-align:center}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}
#hud.on{display:block}
#pbox{position:absolute;left:max(16px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));width:min(26vw,320px)}
.pname{font-family:var(--disp);font-size:15px;color:#fff;margin-bottom:5px;letter-spacing:.06em;text-shadow:0 2px 0 #000;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pname span{font-family:'Chakra Petch';font-weight:700;font-size:12px;color:var(--gold);letter-spacing:.12em;white-space:nowrap}
.bar{position:relative;height:16px;background:rgba(0,0,0,.65);border:1px solid rgba(255,220,150,.35);transform:skewX(-18deg);overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transition:none}
.bar.hp i:nth-child(2){background:linear-gradient(180deg,#ff8b8b,#e8162f 55%,#9a0b1c)}
.bar.hp i:first-child,.bar.bhp i:first-child{background:#fff;opacity:.85}
.bar.hp b{position:absolute;right:8px;top:50%;transform:translateY(-50%) skewX(18deg);font-size:11px;font-weight:700;text-shadow:0 1px 0 #000}
.bar.ult{height:9px;margin-top:6px;width:82%}
.bar.ult i{background:linear-gradient(90deg,#2a7cff,#5ef2ff,#ffffff)}
.bar.ult.full{border-color:var(--cyan);box-shadow:0 0 14px var(--cyan)}
.bar.ult.full i{animation:ultp .6s infinite alternate}
@keyframes ultp{to{filter:brightness(1.6)}}
#blesslist{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
#blesslist span{font-size:11px;padding:2px 7px;background:rgba(255,200,100,.13);border:1px solid rgba(255,200,100,.35);color:var(--gold);font-weight:600}
#bbox{position:absolute;left:50%;transform:translateX(-50%);top:max(14px,env(safe-area-inset-top));width:min(44vw,600px);text-align:center;transition:opacity .4s,transform .5s}
#bbox.off{opacity:0;transform:translate(-50%,-30px)}
#bname{font-family:var(--disp);font-size:clamp(14px,2.2vw,22px);color:#fff;letter-spacing:.06em;text-shadow:0 2px 0 #000,0 0 14px rgba(255,60,60,.6)}
#btitle{font-size:12px;color:#d9a7a7;letter-spacing:.18em;margin-bottom:5px;font-weight:600}
.bar.bhp{height:18px;border-color:rgba(255,140,120,.5)}
.bar.bhp i:nth-child(2){background:linear-gradient(180deg,#ffb36b,#ff3d2e 50%,#8d0d10)}
.bar.bhp.ph2 i:nth-child(2){background:linear-gradient(180deg,#ff9bf0,#c21dff 50%,#4a0a6d)}
.ph2mark{position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.7)}
.bar.poise{height:6px;margin:4px auto 0;width:70%;border-color:rgba(255,220,120,.3)}
.bar.poise i{background:linear-gradient(90deg,#ffb52e,#fff38a)}
.bar.poise.brk i{background:#fff;animation:ultp .2s infinite alternate}
#combo{position:absolute;right:max(22px,env(safe-area-inset-right));top:24%;text-align:right;opacity:0;transition:opacity .3s}
#combo b{display:block;font-family:var(--disp);font-size:clamp(38px,6vw,64px);font-weight:400;line-height:1;background:linear-gradient(#fff,#ffd36b 50%,#ff7a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a1200)}
#combo span{font-family:var(--disp);font-size:13px;letter-spacing:.25em;color:#ffcf8a}
#combo.pop b{animation:pop .25s cubic-bezier(.3,2,.5,1)}
@keyframes pop{from{transform:scale(1.5)}to{transform:scale(1)}}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--disp);font-size:clamp(28px,6vw,64px);color:#fff;opacity:0;letter-spacing:.06em}
#banner.show{animation:banner 1.4s cubic-bezier(.2,1,.3,1) both}
@keyframes banner{0%{opacity:0;transform:scale(2.4);filter:blur(10px)}15%{opacity:1;transform:scale(1);filter:none}75%{opacity:1;transform:scale(1.04)}100%{opacity:0;transform:scale(1.1) translateY(-20px)}}
#skills{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));right:max(16px,env(safe-area-inset-right));display:flex;gap:7px;transition:opacity .4s}
#hud.intro #skills,#hud.intro #pbox{opacity:0}
#pbox{transition:opacity .4s}
.sk{width:52px;height:52px;position:relative;background:rgba(10,8,18,.75);border:1px solid rgba(255,210,122,.4);display:flex;align-items:center;justify-content:center;
 clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.sk svg,.tb svg{width:58%;height:58%;stroke:#ffe2a8;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(255,180,80,.7));position:relative;z-index:1}
.sk .cd,.tb .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.78) calc(var(--cd,0)*360deg),transparent 0);z-index:2;pointer-events:none}
.sk .cdt,.tb .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;font-weight:700;font-size:17px;text-shadow:0 2px 0 #000}
.sk kbd{position:absolute;left:3px;bottom:3px;z-index:4;font-size:10px;min-width:16px;padding:0 4px}
.sk.ready{border-color:var(--gold);box-shadow:inset 0 0 18px rgba(255,180,60,.35)}
.sk.ult.ready{border-color:var(--cyan);box-shadow:inset 0 0 22px rgba(94,242,255,.6)}
.sk.ult.ready svg{stroke:#bff9ff}
#pausebtn{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));width:42px;height:42px;pointer-events:auto;font-family:var(--disp);font-size:16px;color:var(--gold);background:rgba(10,8,18,.6);border:1px solid rgba(255,210,122,.4)}
/* boss intro */
#intro{position:fixed;left:6vw;bottom:15vh;z-index:12;pointer-events:none;display:none}
#intro.on{display:block}
#intro .it{font-size:clamp(12px,1.8vw,17px);letter-spacing:.35em;color:#ffb3a0;font-weight:600;animation:slideR .7s .2s cubic-bezier(.2,1,.3,1) both}
#intro .in{font-family:var(--disp);font-size:clamp(34px,7.4vw,92px);line-height:1;color:#fff;letter-spacing:.02em;
 text-shadow:0 4px 0 #2a0505,0 0 30px rgba(255,50,50,.65);animation:slam .7s .35s cubic-bezier(.2,1.6,.4,1) both}
#intro .il{height:3px;margin-top:10px;background:linear-gradient(90deg,var(--red),transparent);animation:line 1s .6s cubic-bezier(.7,0,.2,1) both;transform-origin:left}
#intro .ist{margin-top:8px;font-size:clamp(12px,1.6vw,15px);color:#c9bcd4;animation:slideR .8s .9s ease both}
@keyframes slideR{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes slam{from{opacity:0;transform:scale(2.6) translateX(60px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* stage banner */
#stagecard{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,.2),rgba(0,0,0,.85))}
#stagecard.on{display:flex;animation:fadein .4s both}
#stagecard .sn{font-family:var(--disp);font-size:clamp(16px,2.6vw,24px);letter-spacing:.6em;color:var(--gold);animation:slideR .8s both;padding-left:.6em}
#stagecard .st{font-family:var(--disp);font-size:clamp(36px,8vw,96px);color:#fff;text-align:center;line-height:1.05;margin:10px 0;text-shadow:0 5px 0 #000,0 0 30px rgba(255,140,60,.5);animation:slam .9s .2s cubic-bezier(.2,1.5,.4,1) both}
#stagecard .sd{font-size:clamp(13px,1.8vw,18px);color:#d6c8e0;letter-spacing:.1em;animation:fadein 1s .8s both;text-align:center}
/* blessing */
.cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:1000px}
.card{width:min(80vw,250px);min-height:250px;padding:22px 18px;background:linear-gradient(170deg,rgba(40,22,10,.92),rgba(12,8,20,.95));border:1px solid rgba(255,200,110,.45);text-align:center;position:relative;
 clip-path:polygon(0 14px,14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px));
 transition:transform .3s cubic-bezier(.34,1.6,.64,1),box-shadow .3s;animation:cardIn .6s cubic-bezier(.2,1.3,.4,1) both;pointer-events:auto}
.card:nth-child(2){animation-delay:.12s}.card:nth-child(3){animation-delay:.24s}
@keyframes cardIn{from{opacity:0;transform:translateY(60px) rotateX(50deg) scale(.8)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-10px) scale(1.04);box-shadow:inset 0 0 50px rgba(255,170,60,.25)}
.card .ic{font-size:52px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 0 14px rgba(255,170,60,.8))}
.card b{display:block;font-family:var(--disp);font-weight:400;font-size:21px;color:var(--gold);margin-bottom:10px}
.card p{font-size:14px;line-height:1.5;color:#e6dcef}
.card .rar{position:absolute;top:10px;right:14px;font-size:10px;letter-spacing:.2em;color:#ffb36b;font-weight:700}
/* touch */
#touch{position:fixed;inset:0;z-index:11;display:none;pointer-events:none}
#touch.on{display:block}
#joyzone{position:absolute;left:0;top:18%;bottom:0;width:48%;pointer-events:auto}
#joy{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:2px solid rgba(255,210,122,.35);background:radial-gradient(circle,rgba(255,200,100,.08),rgba(0,0,0,.25));opacity:.5;transition:opacity .2s;left:120px;top:calc(100% - 130px)}
#joy.act{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff1c8,#ffb340 60%,#a85a10);box-shadow:0 0 18px rgba(255,170,60,.7)}
.tb{position:absolute;width:64px;height:64px;border-radius:50%;pointer-events:auto;background:radial-gradient(circle at 50% 35%,rgba(60,40,30,.8),rgba(10,8,16,.85));border:2px solid rgba(255,210,122,.5);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:transform .08s}
.tb.press{transform:scale(.88);border-color:#fff}
.tb.big{width:96px;height:96px;border-width:3px}
.tb.ult{border-color:rgba(94,242,255,.6)}
.tb.ult.ready{box-shadow:0 0 22px var(--cyan);border-color:var(--cyan)}
.tb .cd{border-radius:50%}
.tb .lbl{position:absolute;bottom:3px;font-size:9px;font-weight:700;letter-spacing:.05em;color:#ffe2a8;z-index:4;text-shadow:0 1px 0 #000}
#loading{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);color:var(--gold);letter-spacing:.3em;font-size:18px}
#loading .ld{width:200px;height:3px;background:#222;margin-top:16px;overflow:hidden}
#loading .ld i{display:block;height:100%;width:40%;background:var(--gold);animation:ld 1s infinite ease-in-out}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.stats{font-size:15px;color:#ddd;margin:-6px 0 22px;text-align:center;line-height:1.7}
.stats b{color:var(--gold)}
.toggle{position:fixed;right:16px;bottom:14px;z-index:40;font-size:13px;color:var(--gold);padding:8px 12px;background:rgba(0,0,0,.5);border:1px solid rgba(255,210,122,.35);font-weight:700;letter-spacing:.06em}
@media (max-width:820px){ .btn{min-width:220px;padding:12px 30px} #pbox{width:min(40vw,260px)} #bbox{width:min(50vw,420px);left:auto;right:70px;transform:none} #bbox.off{transform:translateY(-30px)} .pname{font-size:12px} .bar{height:12px} #btitle{display:none} #bname{font-size:13px} }
@media (max-width:560px){ #bbox{top:78px;left:16px;right:16px;width:auto} }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="vignette"></div><div id="lowhp"></div><div id="hurtfx"></div><div id="flashfx"></div>
<div id="letterbox"><i></i><i></i></div>
<div id="dmg"></div>

<div id="hud">
 <div id="pbox">
  <div class="pname">KIẾM SĨ THIÊN LÔI <span id="lvtag">MÀN 1 · 1/3</span></div>
  <div class="bar hp"><i id="php-lag"></i><i id="php"></i><b id="phptxt">100</b></div>
  <div class="bar ult" id="ultbar"><i id="pult"></i></div>
  <div id="blesslist"></div>
 </div>
 <div id="bbox" class="off">
  <div id="bname">—</div><div id="btitle"></div>
  <div class="bar bhp" id="bhpbar"><i id="bhp-lag"></i><i id="bhp"></i><span class="ph2mark"></span></div>
  <div class="bar poise" id="poisebar"><i id="bpoise"></i></div>
 </div>
 <div id="combo"><b id="combon">0</b><span>LIÊN KÍCH</span></div>
 <div id="skills"></div>
 <button id="pausebtn">II</button>
 <div id="banner"></div>
</div>
<div id="intro"><div class="it" id="ititle"></div><div class="in" id="iname"></div><div class="il"></div><div class="ist" id="isub"></div></div>
<div id="stagecard"><div class="sn" id="scn"></div><div class="st" id="sct"></div><div class="sd" id="scd"></div></div>

<div id="touch">
 <div id="joyzone"><div id="joy"><div id="knob"></div></div></div>
</div>

<div class="screen dim" id="s-device">
 <div class="h2">CHỌN THIẾT BỊ CHƠI</div>
 <div class="devs">
  <button class="dev" id="dev-pc"><span class="rec-tag">ĐỀ XUẤT</span>

const Music={timer:null,step:0,next:0,bpm:96,level:0,root:55,
 start(){if(!Snd.ctx||this.timer)return;this.next=Snd.ctx.currentTime+.1;this.timer=setInterval(()=>this.tick(),30);},
 tick(){const c=Snd.ctx;if(!c||!Snd.on)return;while(this.next<c.currentTime+.15){this.play(this.step,this.next-c.currentTime);this.next+=60/this.bpm/4;this.step=(this.step+1)%64;}},
 set(level,root,bpm){this.level=level;if(root)this.root=root;if(bpm)this.bpm=bpm;},
 play(st,d){
  const S=Snd,r=this.root,L=this.level,D=S.mus,sc=[0,2,3,5,7,8,10];
  const bar=(st/16|0),prog=[0,-4,-2,-5][bar%4];const R=r*Math.pow(2,prog/12);
  if(st%16===0){[1,1.5,2*1.189].forEach((m,i)=>S.tone({type:'sawtooth',f:R*2*m,t:60/this.bpm*4.2,v:L?.035:.05,lp:L?900:600,a:.6,det:i*7-7,delay:d,dest:D,wet:.5}));
   S.tone({type:'sine',f:R,t:60/this.bpm*4,v:.25,a:.3,delay:d,dest:D});}
  if(L>=1){
   const kick=[0,7,8,14,16+0,16+6,16+10];
   if(kick.includes(st%32)){S.tone({type:'sine',f:150,f2:38,t:.35,v:.7,delay:d,dest:D});S.noise({t:.03,v:.2,ft:'highpass',f:3000,delay:d,dest:D});}
   if(st%16===4||st%16===12){S.tone({type:'sine',f:110,f2:70,t:.4,v:.45,delay:d,dest:D,wet:.4});S.noise({t:.18,v:.3,ft:'bandpass',f:900,q:1,delay:d,dest:D,wet:.3});}
   if(st%2===0||L>=2)S.noise({t:.04,v:st%4===2?.09:.045,ft:'highpass',f:7000,delay:d,dest:D});
   const bl=[0,0,null,0,null,7,0,null,3,null,0,null,10,null,7,null];const n=bl[st%16];
   if(n!==null)S.tone({type:'sawtooth',f:R*Math.pow(2,n/12),t:.22,v:.16,lp:420+L*200,delay:d,dest:D});
   if(st%4===2||(L>=2&&st%2===1)){const i=(st*5+bar*3)%7;S.tone({type:'square',f:R*4*Math.pow(2,sc[i]/12),t:.18,v:.025,lp:2400,delay:d,dest:D,wet:.5});}
  }else if(st%8===0){S.tone({type:'triangle',f:R*4*Math.pow(2,sc[(st/8|0)%7]/12),t:1.2,v:.04,delay:d,dest:D,wet:.8});}
 }
};

class Particles{
 constructor(n,blend=THREE.AdditiveBlending){
  this.n=n;this.i=0;const g=this.geo=new THREE.BufferGeometry();
  this.pos=new Float32Array(n*3);this.col=new Float32Array(n*3);this.sz=new Float32Array(n);this.al=new Float32Array(n);
  this.vel=new Float32Array(n*3);this.life=new Float32Array(n);this.max=new Float32Array(n);this.grav=new Float32Array(n);this.drag=new Float32Array(n);this.s0=new Float32Array(n);this.grow=new Float32Array(n);
  g.setAttribute('position',new THREE.BufferAttribute(this.pos,3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('color',new THREE.BufferAttribute(this.col,3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('size',new THREE.BufferAttribute(this.sz,1).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('alpha',new THREE.BufferAttribute(this.al,1).setUsage(THREE.DynamicDrawUsage));
  this.mat=new THREE.ShaderMaterial({uniforms:{uScale:{value:400},uTex:{value:radialTex}},
   vertexShader:`attribute float size;attribute float alpha;attribute vec3 color;varying vec3 vC;varying float vA;uniform float uScale;
    void main(){vC=color;vA=alpha;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=size*uScale/max(.1,-mv.z);gl_Position=projectionMatrix*mv;}`,
   fragmentShader:`varying vec3 vC;varying float vA;uniform sampler2D uTex;void main(){float a=texture2D(uTex,gl_PointCoord).a*vA;if(a<.004)discard;gl_FragColor=vec4(vC*a,a);}`,
   transparent:true,depthWrite:false,blending:blend});
  this.pts=new THREE.Points(g,this.mat);this.pts.frustumCulled=false;this.pts.renderOrder=5;scene.add(this.pts);this.resize();
 }
 resize(){this.mat.uniforms.uScale.value=renderer.domElement.height/(2*Math.tan(camera.fov*PI/360));}
 spawn(x,y,z,vx,vy,vz,life,size,r,g,b,grav=0,drag=0,grow=0){
  const i=this.i;this.i=(i+1)%this.n;const j=i*3;
  this.pos[j]=x;this.pos[j+1]=y;this.pos[j+2]=z;this.vel[j]=vx;this.vel[j+1]=vy;this.vel[j+2]=vz;
  this.col[j]=r;this.col[j+1]=g;this.col[j+2]=b;this.life[i]=this.max[i]=life;this.s0[i]=size;this.grav[i]=grav;this.drag[i]=drag;this.grow[i]=grow;this.al[i]=1;this.sz[i]=size;
 }
 update(dt){
  const P=this.pos,V=this.vel;
  for(let i=0;i<this.n;i++){
   if(this.life[i]<=0){if(this.al[i]!==0){this.al[i]=0;}continue;}
   this.life[i]-=dt;const j=i*3;
   if(this.life[i]<=0){this.al[i]=0;continue;}
   const dr=1-Math.min(1,this.drag[i]*dt);V[j]*=dr;V[j+1]=V[j+1]*dr-this.grav[i]*dt;V[j+2]*=dr;
   P[j]+=V[j]*dt;P[j+1]+=V[j+1]*dt;P[j+2]+=V[j+2]*dt;
   if(P[j+1]<.02&&this.grav[i]>0){P[j+1]=.02;V[j+1]*=-.3;V[j]*=.7;V[j+2]*=.7;}
   const k=this.life[i]/this.max[i];this.al[i]=k<.7?k/.7:1;this.al[i]*=this.al[i];
   this.sz[i]=this.s0[i]*(this.grow[i]?(1+(1-k)*this.grow[i]):(.35+.65*k));
  }
  const a=this.geo.attributes;a.position.needsUpdate=a.color.needsUpdate=a.size.needsUpdate=a.alpha.needsUpdate=true;
 }
}
let FX=null;const _c=new THREE.Color();

const teleVS=`varying vec2 vP;void main(){vP=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
const teleFS=`uniform float uP,uMode,uR,uRi,uL,uW,uT,uA;uniform vec3 uC;varying vec2 vP;
void main(){float f,e;
 if(uMode<.5){float r=length(vP);f=(r-uRi)/max(uR-uRi,.001);e=smoothstep(uR-.22,uR,r);if(uRi>0.)e=max(e,1.-smoothstep(uRi,uRi+.22,r));}
 else{f=vP.y/uL;e=max(smoothstep(uW*.5-.18,uW*.5,abs(vP.x)),smoothstep(uL-.25,uL,vP.y));}

 float front=smoothstep(.07,0.,abs(f-uP))*step(.01,uP)*step(uP,.995);

 float a=.1+stripes+.32*fill+.8*e+.7*front;
 vec3 col=uC*(1.1+e*1.6+front*2.5+fill*.4);
 gl_FragColor=vec4(col*a*uA,a*uA*(.82+.18*pulse));}`;

 if(o.shape==='circle')geo=new THREE.CircleGeometry(o.r,56);

 const mat=new THREE.ShaderMaterial({uniforms:{uP:{value:0},uMode:{value:mode},uR:{value:o.r||1},uRi:{value:o.ri||0},uL:{value:o.len||1},uW:{value:o.w||1},uT:{value:0},uA:{value:0},uC:{value:col}},
  vertexShader:teleVS,fragmentShader:teleFS,transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending});

class Trail{
 constructor(n,color,life=.16){
  this.n=n;this.life=life;this.pts=[];const g=this.geo=new THREE.BufferGeometry();
  this.p=new Float32Array(n*2*3);this.a=new Float32Array(n*2);this.s=new Float32Array(n*2);
  for(let i=0;i<n;i++){this.s[i*2]=0;this.s[i*2+1]=1;}
  const idx=[];for(let i=0;i<n-1;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}g.setIndex(idx);
  g.setAttribute('position',new THREE.BufferAttribute(this.p,3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('alpha',new THREE.BufferAttribute(this.a,1).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('side',new THREE.BufferAttribute(this.s,1));
  this.mat=new THREE.ShaderMaterial({uniforms:{uC:{value:new THREE.Color(color)},uC2:{value:new THREE.Color(0xffffff)}},
   vertexShader:`attribute float alpha;attribute float side;varying float vA;varying float vS;void main(){vA=alpha;vS=side;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
   fragmentShader:`uniform vec3 uC,uC2;varying float vA;varying float vS;void main(){float a=vA*smoothstep(0.,.6,vS);vec3 c=mix(uC*2.5,uC2*4.,smoothstep(.75,1.,vS)*vA);gl_FragColor=vec4(c*a,a);}`,
   transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
  this.mesh=new THREE.Mesh(g,this.mat);this.mesh.frustumCulled=false;this.mesh.renderOrder=4;scene.add(this.mesh);
 }
 push(a,b){
  const last=this.pts[0];
  if(last){ // subdivide for smoothness
   const steps=Math.min(4,Math.ceil(last.b.distanceTo(b)/.35));
   for(let k=1;k<steps;k++){const u=k/steps;this.pts.unshift({a:last.a.clone().lerp(a,u),b:last.b.clone().lerp(b,u),age:0});}
  }
  this.pts.unshift({a:a.clone(),b:b.clone(),age:0});if(this.pts.length>this.n)this.pts.length=this.n;

 update(dt){
  for(const p of this.pts)p.age+=dt;while(this.pts.length&&this.pts[this.pts.length-1].age>this.life)this.pts.pop();
  const n=this.n;
  for(let i=0;i<n;i++){const p=this.pts[Math.min(i,this.pts.length-1)];const j=i*6;
   if(!p){this.a[i*2]=this.a[i*2+1]=0;continue;}
   this.p[j]=p.a.x;this.p[j+1]=p.a.y;this.p[j+2]=p.a.z;this.p[j+3]=p.b.x;this.p[j+4]=p.b.y;this.p[j+5]=p.b.z;
   const al=i<this.pts.length?Math.max(0,1-p.age/this.life)*(1-i/n):0;this.a[i*2]=this.a[i*2+1]=al;}
  this.geo.attributes.position.needsUpdate=true;this.geo.attributes.alpha.needsUpdate=true;
 }
}

 }
 get cdMax(){return{q:6.5*this.stats.cd,e:8*this.stats.cd,r:5*this.stats.cd,dash:.55,parry:.75};}

  if(G.mobile||!IN.hasAim){const b=G.boss;if(b&&!b.dead&&!b.hide)return Math.atan2(b.pos.x-this.pos.x,b.pos.z-this.pos.z);return this.ang;}
  return Math.atan2(IN.aimX-this.pos.x,IN.aimZ-this.pos.z);
 }
 start(name,data){
  const def=HERO_ACTS[name];this.act={name,def,t:0,data:data||{},fired:new Set()};
  if(name.startsWith('atk'))this.comboT=def.dur+.55;
  if(def.face){this.angT=this.aimAng();}
  if(def.lunge)this.act.lungeAng=this.angT;
 }
 canAct(){return !this.dead&&(!this.act||this.act.t>=(this.act.def.cancel??this.act.def.dur));}

  if(this.dead||G.state!=='fight')return;
  const a=this.act;
  // dash: can cancel most actions early
  if(IN.consume('dash')&&this.cds.dash<=0&&(!a||['atk1','atk2','atk3','wave','hurt','parry'].includes(a.name)&&a.t>.1||a.t>=(a.def.cancel??a.def.dur))){
   let dx=IN.mx,dz=IN.mz;if(Math.hypot(dx,dz)<.2){const an=this.aimAng();dx=Math.sin(an);dz=Math.cos(an);}

   let tx,tz;if(G.mobile||!IN.hasAim){const b=G.boss;if(b&&!b.dead){const an=Math.atan2(b.pos.x-this.pos.x,b.pos.z-this.pos.z);const d=Math.max(0,Math.hypot(b.pos.x-this.pos.x,b.pos.z-this.pos.z)-b.r-.8);tx=this.pos.x+Math.sin(an)*d;tz=this.pos.z+Math.cos(an)*d;}else{tx=this.pos.x+Math.sin(this.ang)*6;tz=this.pos.z+Math.cos(this.ang)*6;}}

   tx=this.pos.x+dx;tz=this.pos.z+dz;const l=Math.hypot(tx,tz);if(l>ARENA){tx*=ARENA/l;tz*=ARENA/l;}
   if(d>.3)this.angT=Math.atan2(dx,dz);this.start('leap',{sx:this.pos.x,sz:this.pos.z,tx,tz});this.cds.e=this.cdMax.e;

   if(!a||a.t>=a.def.dur*.98){this.startCombo();}
   else if(a.name.startsWith('atk')||a.name==='riposte'){this.queued='atk';}
   else if(a.t>=(a.def.cancel??a.def.dur))this.startCombo();
  }
 }

 if(this.healAcc>=4){dmgNum(this.pos.x,2.4,this.pos.z,'+'+Math.round(this.healAcc),'heal');this.healAcc=0;}};
Boss.prototype.remove=function(){scene.remove(this.g);if(this.segG)scene.remove(this.segG);if(this.trailK)scene.remove(this.trailK.mesh);this.def.onCancel&&this.def.onCancel(this);};

 else if(G.state==='stage'){const t=G.real*.08;tx=0;ty=1;tz=0;px=Math.sin(t)*16;py=9;pz=Math.cos(t)*16;l=1.5;}

  let dz2=0;if(b&&!b.dead&&b.root.visible){const dx=b.pos.x-PL.pos.x,dz=b.pos.z-PL.pos.z,d=Math.hypot(dx,dz);dz2=d;const k=Math.min(d,20)/Math.max(d,.01)*.5;tx+=dx*k;tz+=dz*k;}

 camLook.x=damp(camLook.x,tx,l*1.4,rdt);camLook.y=damp(camLook.y,ty,l*1.4,rdt);camLook.z=damp(camLook.z,tz,l*1.4,rdt);

function tick(rdt){
 G.real+=rdt;
 if(G.slowT>0){G.slowT-=rdt;}else G.ts=damp(G.ts,1,5,rdt);
 let dt=rdt*G.ts;if(G.hitstop>0){G.hitstop-=rdt;dt=0;}
 if(G.state==='pause')dt=0;
 G.dt=dt;G.time+=dt;if(G.state==='intro')G.introT+=dt;

 if(G.state!=='pause'){
  PL.update(dt);
  if(G.boss)G.boss.update(dt);
  updateTeles(dt);updateProjs(dt);updateZones(dt);updateFx(dt);FX.update(dt);Game.updateOrbs(dt);
  if(G.env)G.env.update(dt,G.real);
  for(const p of plights){p.t+=dt;p.l.intensity=p.t<p.d?p.i*Math.pow(1-p.t/p.d,2):0;}
 }
 for(const k in IN.press)if(G.state!=='fight')IN.press[k]=false;
 updateCamera(rdt);updateHUD(rdt);updateDn(rdt);
}

 const touch=matchMedia('(pointer:coarse)').matches||'ontouchstart'in window;$(touch?'#dev-mb':'#dev-pc').classList.add('rec');
 Game.show('s-device');
 const bind=(id,fn)=>{const e=$(id);e.addEventListener('click',fn);e.addEventListener('mouseenter',()=>Snd.play('ui'));};
 bind('#dev-pc',()=>Game.pickDevice(false));bind('#dev-mb',()=>Game.pickDevice(true));
 bind('#b-start',()=>Game.start());bind('#b-help',()=>{Snd.play('ui');Game.helpThen=null;Game.openHelp();});bind('#b-helpback',()=>Game.closeHelp());
 bind('#b-resume',()=>Game.resume());bind('#b-phelp',()=>{Game.helpThen=null;Game.openHelp();Game.helpFrom='pause';});bind('#b-quit',()=>{Snd.play('ui');Game.toTitle();});
 bind('#b-retry',()=>Game.retry());bind('#b-dquit',()=>{Snd.play('ui');Game.toTitle();});bind('#b-again',()=>{Snd.play('uiok');Game.toTitle();});
 $('#pausebtn').addEventListener('pointerdown',e=>{e.preventDefault();Game.pause();});
 $('#sndtoggle').addEventListener('click',()=>{Snd.init();Snd.on=!Snd.on;if(Snd.master)Snd.master.gain.value=Snd.on?.85:0;$('#sndtoggle').textContent='♪ ÂM THANH: '+(Snd.on?'BẬT':'TẮT');});
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='fight')Game.pause();});
 loop();
 window.__G=G;window.__Game=Game;window.__sim=(n,dt)=>{for(let i=0;i<n;i++)tick(dt);};window.__IN=IN;window.__loadEnv=loadEnv;window.__PL=()=>PL;
}
try{boot();}catch(e){console.error(e);$('#loading').innerHTML='LỖI KHỞI ĐỘNG<br><small style="font-family:sans-serif;letter-spacing:0;font-size:12px">'+e.message+'</small>';}
</script>
</body>
</html>
