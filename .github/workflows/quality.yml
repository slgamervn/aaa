name: Quality checks

on:
  push:
    branches:
      - design/humanized-library
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Build production application
        run: npm run build

  e2e:
    name: Browser E2E — desktop and mobile
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Wait for the Preview of the exact triggering commit
        id: preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";

          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const sha = process.env.PREVIEW_COMMIT_SHA;
          if (!token || !sha) throw new Error("Missing GitHub token or triggering commit SHA.");

          const endpoint = `https://api.github.com/repos/${repository}/commits/${sha}/status`;
          for (let attempt = 1; attempt <= 80; attempt += 1) {
            const response = await fetch(endpoint, {
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28"
              }
            });
            if (!response.ok) {
              throw new Error(`GitHub status lookup failed: HTTP ${response.status}`);
            }

            const combined = await response.json();
            const deployment = (combined.statuses ?? [])
              .filter((item) => String(item.context ?? "").toLowerCase().startsWith("vercel"))
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];

            if (deployment?.state === "success") {
              const previewUrl = new URL(deployment.target_url ?? "");
              if (previewUrl.protocol !== "https:" || !previewUrl.hostname.endsWith(".vercel.app")) {
                throw new Error("Vercel returned an unexpected Preview URL.");
              }
              console.log(`Preview for ${sha} is ready: ${previewUrl.href}`);
              appendFileSync(process.env.GITHUB_OUTPUT, `base_url=${previewUrl.href}\\n`);
              process.exit(0);
            }
            if (deployment?.state === "failure" || deployment?.state === "error") {
              throw new Error(`Vercel Preview for ${sha} failed: ${deployment.target_url ?? "no URL"}`);
            }

            console.log(`Waiting for Vercel Preview on ${sha} (attempt ${attempt}/80)...`);
            await new Promise((resolve) => setTimeout(resolve, 15_000));
          }

          throw new Error(`Timed out waiting for Vercel Preview on ${sha}.`);
          NODE

      - name: Run browser tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.base_url }}
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pjvault-playwright-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
