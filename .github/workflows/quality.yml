name: Quality checks

on:
  push:
    branches:
      - design/humanized-library
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # Generate a lockfile once, validate it with npm ci, then keep it as a reviewable artifact.
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@v7
        with:
          name: pjvault-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
